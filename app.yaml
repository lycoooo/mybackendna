# Wasmer Edge — app configuration
# NOTE: i-verify ang eksaktong format sa opisyal na docs:
#   https://docs.wasmer.io/edge  →  Guides → Python HTTP server
#
# Deployment:
#   wasmer login
#   wasmer deploy   (mula sa folder na ito)
#
# Public URL pagkatapos i-deploy:  https://<name>.wasmer.app
kind: wasmer.io/App.v0
name: netflix-trial-sender
commands:
  - name: web
    runner: wasmer/python
    args:
      - server.py
# Dependencies (httpx atbp.) ay nasa requirements.txt — kusang
# ini-install ng Python runner ng Wasmer Edge.